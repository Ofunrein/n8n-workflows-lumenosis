name: Workflow credential guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: workflow-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discord-webhooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-discord-webhooks.py
      - run: python3 scripts/check-discord-webhooks.py
