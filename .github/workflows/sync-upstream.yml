name: 🔍 Audit Upstream Changes

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-audit
  cancel-in-progress: true

jobs:
  audit-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📡 Fetch Upstream
        run: |
          git remote add upstream https://github.com/Zie619/n8n-workflows.git
          git fetch --no-tags --depth=1 upstream main

      - name: 🔍 Report Divergence
        id: audit
        shell: bash
        run: |
          current_commit=$(git rev-parse HEAD)
          upstream_commit=$(git rev-parse upstream/main)
          workflow_changes=$(git diff --name-only HEAD upstream/main -- workflows/ | wc -l | tr -d ' ')

          {
            echo "current_commit=$current_commit"
            echo "upstream_commit=$upstream_commit"
            echo "workflow_changes=$workflow_changes"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Upstream audit"
            echo "- Current commit: \`$current_commit\`"
            echo "- Upstream commit: \`$upstream_commit\`"
            echo "- Differing workflow files: $workflow_changes"
            echo
            echo "> This workflow is intentionally read-only. Upstream has diverged substantially from this Vercel fork, so updates require a reviewed migration."
          } >> "$GITHUB_STEP_SUMMARY"
